<div class="container register-container">
  <div class="card">
    <h2 class="register-title">Регистрация</h2>
    
    <form (ngSubmit)="onSubmit(registerForm)" #registerForm="ngForm">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" [(ngModel)]="request.login" name="login" #login="ngModel" required minlength="3" maxlength="50" />
        <p class="field-error" *ngIf="login.invalid && (login.dirty || login.touched || registerForm.submitted)">
          <span *ngIf="login.errors?.['required']">Логин обязателен</span>
          <span *ngIf="login.errors?.['minlength']">Логин должен быть от 3 символов</span>
        </p>
      </div>
      
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" [(ngModel)]="request.password" name="password" #password="ngModel" required minlength="8" />
        <p class="field-error" *ngIf="password.invalid && (password.dirty || password.touched || registerForm.submitted)">
          <span *ngIf="password.errors?.['required']">Пароль обязателен</span>
          <span *ngIf="password.errors?.['minlength']">Пароль должен быть не менее 8 символов</span>
        </p>
      </div>
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="request.email" name="email" #email="ngModel" required email />
        <p class="field-error" *ngIf="email.invalid && (email.dirty || email.touched || registerForm.submitted)">
          <span *ngIf="email.errors?.['required']">Email обязателен</span>
          <span *ngIf="email.errors?.['email']">Неверный формат email</span>
        </p>
      </div>
      
      <div class="form-group">
        <label>ФИО</label>
        <input type="text" [(ngModel)]="request.fullName" name="fullName" #fullName="ngModel" required />
        <p class="field-error" *ngIf="fullName.invalid && (fullName.dirty || fullName.touched || registerForm.submitted)">
          <span *ngIf="fullName.errors?.['required']">ФИО обязательно</span>
        </p>
      </div>
      
      <div class="form-group">
        <label>Телефон</label>
        <input type="tel" [(ngModel)]="request.phone" name="phone" #phone="ngModel" pattern="\+?[0-9]{10,15}" />
      </div>
      
      <div class="form-group">
        <label>Дата рождения</label>
        <input type="date" [(ngModel)]="request.birthday" name="birthday" #birthday="ngModel" required />
        <p class="field-error" *ngIf="(birthday.dirty || birthday.touched || registerForm.submitted) && birthdayError">
          {{ birthdayError }}
        </p>
      </div>
      
      <div *ngIf="error" class="error error-mb">
        {{ error }}
      </div>
      
      <button type="submit" class="btn btn-primary btn-full" [disabled]="loading">
        {{ loading ? 'Регистрация...' : 'Зарегистрироваться' }}
      </button>
    </form>
    
    <p class="register-footer">
      Уже есть аккаунт? <a routerLink="/login">Войти</a>
    </p>
  </div>
</div>
