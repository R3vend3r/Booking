<div class="container login-container">
  <div class="card">
    <h2 class="login-title">Вход</h2>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label>Логин</label>
        <input
                type="text"
                [(ngModel)]="request.login"
                name="login"
                required
                minlength="3"
                maxlength="50"
                #login="ngModel"
                [class.is-invalid]="login.invalid && login.touched"
        />
        <div *ngIf="login.invalid && login.touched" class="invalid-feedback">
          <div *ngIf="login.errors?.['required']">Логин обязателен для заполнения</div>
          <div *ngIf="login.errors?.['minlength']">Логин должен содержать минимум 3 символа</div>
          <div *ngIf="login.errors?.['maxlength']">Логин не должен превышать 50 символов</div>
        </div>
      </div>

      <div class="form-group">
        <label>Пароль</label>
        <input
                type="password"
                [(ngModel)]="request.password"
                name="password"
                required
                minlength="8"
                maxlength="100"
                #password="ngModel"
                [class.is-invalid]="password.invalid && password.touched"
        />
        <div *ngIf="password.invalid && password.touched" class="invalid-feedback">
          <div *ngIf="password.errors?.['required']">Пароль обязателен для заполнения</div>
          <div *ngIf="password.errors?.['minlength']">Пароль должен содержать минимум 8 символов</div>
          <div *ngIf="password.errors?.['maxlength']">Пароль не должен превышать 100 символов</div>
        </div>
      </div>

      <div *ngIf="error" class="error error-mb">
        {{ error }}
      </div>

      <button
              type="submit"
              class="btn btn-primary btn-full"
              [disabled]="loading || loginForm.invalid"
      >
        {{ loading ? 'Вход...' : 'Войти' }}
      </button>
    </form>

    <p class="login-footer">
      Нет аккаунта? <a routerLink="/register">Зарегистрироваться</a>
    </p>
  </div>
</div>
